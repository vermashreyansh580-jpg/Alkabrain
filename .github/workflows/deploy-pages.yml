name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libs
        run: pnpm run typecheck:libs

      - name: Build frontend for GitHub Pages
        env:
          BASE_PATH: /Alkabrain/
          VITE_API_BASE_URL: https://shrey77777-alkabrain.hf.space
          NODE_ENV: production
        run: pnpm --filter @workspace/ai-router run build

      - name: Add SPA 404 fallback
        run: cp artifacts/ai-router/dist/public/index.html artifacts/ai-router/dist/public/404.html

      - name: Add .nojekyll
        run: touch artifacts/ai-router/dist/public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/ai-router/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
